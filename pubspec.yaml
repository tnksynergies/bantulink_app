name: bantulink
description: BantuLink - Une seule app, deux mondes.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  dio: ^5.7.0
  go_router: ^14.6.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  html: ^0.15.5
  file_picker: ^8.1.7
  intl: ^0.20.2
  web_socket_channel: ^3.0.1
  google_sign_in: ^6.2.1
  webview_flutter: ^4.7.0
  pdf: ^3.11.1
  printing: ^5.13.4
  flutter_local_notifications: ^18.0.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/onboarding/

# Icones launcher generees par `dart run flutter_launcher_icons`.
# Source unique : assets/logos/app_icon.png (1024x1024 recommande).
flutter_launcher_icons:
  android: true                # remplace mipmap-*/ic_launcher.png directement
  ios: true                    # generera Runner/Assets.xcassets/AppIcon.appiconset
  web:
    generate: true             # generera web/icons/Icon-*.png + favicon
    image_path: 'assets/logos/app_icon.png'
    background_color: '#FFFFFF'
    theme_color: '#1C2F6B'
  windows:
    generate: true
    image_path: 'assets/logos/app_icon.png'
  image_path: 'assets/logos/app_icon.png'
  # Icone adaptative Android (recommandee sur Android 8+)
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: 'assets/logos/app_icon.png'
  min_sdk_android: 21
  remove_alpha_ios: true

